# ──────────────────────────────────────────────────────────────
# tmux configuration - Modern setup for iTerm2
# Inspired by gpakosz/.tmux with Claude-themed styling
# ──────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────
# General
# ──────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -g focus-events on

# Use Homebrew zsh if available, otherwise system zsh
if-shell "test -x /opt/homebrew/bin/zsh" "set -g default-shell /opt/homebrew/bin/zsh" "set -g default-shell /bin/zsh"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# ──────────────────────────────────────────────────────────────
# Prefix key: Ctrl-a (like screen, easier than Ctrl-b)
# ──────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ──────────────────────────────────────────────────────────────
# Key bindings
# ──────────────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrow pane navigation (without prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow to switch windows (without prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes with Ctrl+hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Toggle synchronize-panes
bind S setw synchronize-panes

# Quick session switching
bind -r ( switch-client -p
bind -r ) switch-client -n

# ──────────────────────────────────────────────────────────────
# Vi mode for copy
# ──────────────────────────────────────────────────────────────

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# macOS clipboard integration
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# ──────────────────────────────────────────────────────────────
# Status bar - Claude/Anthropic inspired theme
# Colors: Deep terracotta (#D97757), warm background
# ──────────────────────────────────────────────────────────────

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#c4b5a0,bg=#1a1714"

# Left status: session name
set -g status-left-length 40
set -g status-left "#[fg=#1a1714,bg=#D97757,bold]  #S #[fg=#D97757,bg=#2d2620]#[fg=#c4b5a0,bg=#2d2620] #I:#P #[fg=#2d2620,bg=#1a1714]"

# Right status: host, date, time
set -g status-right-length 80
set -g status-right "#[fg=#2d2620,bg=#1a1714]#[fg=#c4b5a0,bg=#2d2620] %Y-%m-%d #[fg=#D97757,bg=#2d2620]#[fg=#1a1714,bg=#D97757,bold] %H:%M #[fg=#c4b5a0,bg=#D97757]#[fg=#1a1714,bg=#c4b5a0,bold] #h "

# Window status
setw -g window-status-format "#[fg=#7a7067,bg=#1a1714]  #I #W  "
setw -g window-status-current-format "#[fg=#1a1714,bg=#2d2620]#[fg=#D97757,bg=#2d2620,bold] #I #W #[fg=#2d2620,bg=#1a1714]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#2d2620"
set -g pane-active-border-style "fg=#D97757"

# Message styling
set -g message-style "fg=#D97757,bg=#2d2620,bold"
set -g message-command-style "fg=#c4b5a0,bg=#2d2620"

# Mode (copy mode, etc.)
setw -g mode-style "fg=#1a1714,bg=#D97757,bold"

# Clock
setw -g clock-mode-colour "#D97757"

# Bell
setw -g window-status-bell-style "fg=#1a1714,bg=#D97757,bold"

# ──────────────────────────────────────────────────────────────
# TPM - tmux Plugin Manager
# ──────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings (auto-save/restore)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/bin/tpm'
